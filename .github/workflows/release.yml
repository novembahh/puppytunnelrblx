name: Nightly Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build (release)
        run: cargo build --release

      - name: Stage files
        shell: bash
        run: |
          cp target/release/puppytunnel.exe PuppyTunnel-Windows-x86_64.exe
          cp target/release/puppytunnel.pdb PuppyTunnel-Windows-x86_64.pdb

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            PuppyTunnel-Windows-x86_64.exe
            PuppyTunnel-Windows-x86_64.pdb

  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-linux

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: PuppyTunnel-Linux-x86_64

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish nightly release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: nightly
          prerelease: true
          title: Nightly Build
          files: |
            dist/PuppyTunnel-Windows-x86_64.exe
            dist/PuppyTunnel-Windows-x86_64.pdb
            dist/PuppyTunnel-Linux-x86_64

      - name: Publish versioned nightly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-nightly.${{ github.run_number }}
          name: Nightly v1.0.0-nightly.${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          files: |
            dist/PuppyTunnel-Windows-x86_64.exe
            dist/PuppyTunnel-Windows-x86_64.pdb
            dist/PuppyTunnel-Linux-x86_64
