[package]
name = "puppytunnel"
version = "1.0.0-beta.2"
edition = "2021"
authors = ["PuppyTunnel"]
description = "Host and join Roblox Studio sessions through a tunnel or private relay"
license = "GPL-3.0-only"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:arboard", "dep:rfd", "dep:rodio"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "fast-rng"] }
rand = "0.8"
chrono = "0.4"
regex = "1.10"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
arboard = { version = "3.4", features = ["wayland-data-control"], optional = true }
rfd = { version = "0.15", optional = true }
ureq = { version = "2.10", features = ["json"] }
tiny_http = "0.12"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "__screenshot"] , optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-mp3"], optional = true }
socket2 = { version = "0.5", features = ["all"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_Console"
] }

[build-dependencies]
winres = "0.1"
